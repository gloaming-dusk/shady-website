name: Check

# The site deploys from gloaming-dusk/shady (.github/workflows/pages.yml), so
# it is served at https://gloaming-dusk.github.io/shady/. This checks that it
# builds against Shady's main branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Shady
        uses: actions/checkout@v4
        with:
          repository: gloaming-dusk/shady
          path: shady

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Astro site
        run: npm run check

      - name: Build static site
        run: npm run build
